name: Build, Test and Release Strilight

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ===========================================================================
  # 1. Automated Test Suite (Windows & Linux Matrix)
  # ===========================================================================
  test:
    name: Test on ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]
        python-version: [ '3.10', '3.11', '3.12' ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Build & Test Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel cython pytest
          pip install capstone>=5.0.0 z3-solver>=4.12.0
          pip install -e .

      - name: Run Core & SMT Unit Tests
        env:
          PYTHONPATH: .
        run: |
          pytest strilight/tests/test_facade.py strilight/tests/test_strided_interval_notion.py strilight/tests/test_loop_compressor.py strilight/tests/test_nested_loops.py strilight/tests/test_po[...]

  # ===========================================================================
  # 2. Build Binary Wheels (.whl) for Windows & Linux
  # ===========================================================================
  build-wheels:
    name: Build Wheels on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ windows-latest, ubuntu-latest ]
        python-version: [ '3.10', '3.11', '3.12' ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Compilers & Packaging Tools
        run: |
          python -m pip install --upgrade pip setuptools wheel cython capstone z3-solver

      - name: Compile Cython Binary Extensions & Build Wheel
        run: |
          python setup.py build_ext --inplace --cython
          python setup.py bdist_wheel

      - name: Upload Wheel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl

  # ===========================================================================
  # 3. Automated Cross-Repository Release to Public Showcase (asama7706r-ui/strilight)
  # ===========================================================================
  release:
    name: Publish Binary Release to Public Repository
    needs: build-wheels
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download all built wheels
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List downloaded artifacts
        run: |
          echo "Contents of release-assets:"
          find release-assets -type f -ls

      - name: Package Standalone Tests & Demo Bundle
        run: |
          mkdir -p test-bundle/tests
          cp -r strilight/tests/* test-bundle/tests/
          cp demo.py README.md test-bundle/
          cd test-bundle && zip -r ../release-assets/strilight-tests-bundle.zip . && cd ..
          
          # Ensure all artifacts are at the root of release-assets
          find release-assets -name "*.whl" -type f | while read file; do
            if [ "$(dirname "$file")" != "release-assets" ]; then
              cp "$file" release-assets/
            fi
          done
          
          echo "Final release-assets contents:"
          ls -la release-assets/

      - name: Sync Public Showcase README & Demo to Public Repo
        env:
          PUBLIC_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          if [ -n "$PUBLIC_TOKEN" ]; then
            echo "[*] Syncing README.md and demo.py to public repository..."
            git clone https://x-access-token:${PUBLIC_TOKEN}@github.com/asama7706r-ui/strilight.git public_repo || true
            if [ -d "public_repo" ]; then
              cp README.md demo.py public_repo/
              cd public_repo
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add README.md demo.py
              git diff --quiet && git diff --staged --quiet || (git commit -m "docs: Update public showcase README & Demo" && git push origin main)
              cd ..
            fi
          fi

      - name: Publish Release to Public Repository
        uses: softprops/action-gh-release@v2
        with:
          repository: asama7706r-ui/strilight
          token: ${{ secrets.PUBLIC_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          files: release-assets/*
          tag_name: ${{ github.ref_name || 'v0.1.0' }}
          name: Strilight ${{ github.ref_name || 'v0.1.0' }}
          body: |
            # 🌟 Strilight Release
            
            High-Performance $O(1)$ SMT Loop Lifting & Strided Interval Domain for x86_64 Binary Analysis.
            
            ---
            
            ### 📦 Included Release Packages:
            - **Cross-Platform Binary Wheels (`.whl`):** Closed binary extensions for Windows (`.pyd`) and Linux (`.so`) across Python 3.10, 3.11, and 3.12.
            - **Standalone Test & Documentation Bundle (`strilight-tests-bundle.zip`):** Contains `demo.py`, `README.md`, and all pure unit test suites for verifying your installation!
            
            ---
            
            ### 🚀 Quick Installation:
            ```bash
            # 1. Install the wheel matching your environment:
            pip install <wheel_filename>.whl[solver]
            
            # 2. Run verification demo
            python demo.py
            ```
            
            ### 🧪 To verify tests locally:
            Unzip `strilight-tests-bundle.zip` and run:
            ```bash
            pytest tests/ -v
            ```
          draft: false
          prerelease: true
