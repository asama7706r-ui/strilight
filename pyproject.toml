[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strilight"
version = "0.1.0"
description = "High-Performance O(1) SMT Loop Lifting & Strided Interval Domain for x86_64"
readme = "README.md"
authors = [
    { name = "Asama", email = "asama7706r@gmail.com" }
]
license = { text = "GPL-3.0-or-later / Commercial Dual-License" }
requires-python = ">=3.9"
dependencies = [
    "capstone>=5.0.0"
]

[project.optional-dependencies]
tracker = []
solver = [
    "z3-solver>=4.12.0"
]
all = [
    "capstone>=5.0.0",
    "z3-solver>=4.12.0"
]

[tool.setuptools.packages.find]
include = ["strilight*"]
exclude = ["strilight.tests*"]

[tool.setuptools.package-data]
strilight = ["py.typed"]
