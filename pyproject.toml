[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strilight"
version = "0.2.0"
description = "High-Performance O(1) / O(log N) Algebraic Loop Acceleration & Exact Rational Recurrence Engine for Python and C"
readme = "README.md"
authors = [
    { name = "Asama", email = "asama7706r@gmail.com" }
]
license = { text = "GPL-3.0-or-later / Commercial Dual-License" }
requires-python = ">=3.9"
dependencies = [
    "pycparser>=2.21"
]

[project.optional-dependencies]
disasm = [
    "capstone>=5.0.0"
]
solver = [
    "z3-solver>=4.12.0"
]
all = [
    "pycparser>=2.21",
    "capstone>=5.0.0",
    "z3-solver>=4.12.0"
]

[tool.setuptools.packages.find]
include = ["strilight*"]
exclude = ["strilight.tests*", "strilight.arch*", "strilight.extensions*"]

[tool.setuptools.package-data]
strilight = ["py.typed"]
